<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Dome / Arch Silhouette in background -->
  <path d="M 176 340 C 176 220, 256 160, 256 130 C 256 160, 336 220, 336 340 Z" fill="rgba(255,255,255,0.08)" />

  <!-- Main Arabic Letter "ح" (Hekr Al-Jameh) stylized -->
  <g filter="url(#shadow)">
    <!-- Crescent / Arch motif at top -->
    <circle cx="256" cy="115" r="16" fill="url(#goldGrad)" />
    
    <!-- Central Emblem Text/Shape -->
    <text x="256" y="335" 
          font-family="system-ui, -apple-system, Cairo, Arial, sans-serif" 
          font-size="220" 
          font-weight="900" 
          fill="#ffffff" 
          text-anchor="middle" 
          dominant-baseline="alphabetic">ح</text>
  </g>

  <!-- Bottom subtitle badge -->
  <rect x="116" y="380" width="280" height="44" rx="22" fill="#0f172a" opacity="0.8" />
  <text x="256" y="410" 
        font-family="system-ui, -apple-system, Cairo, Arial, sans-serif" 
        font-size="20" 
        font-weight="800" 
        fill="#34d399" 
        text-anchor="middle" 
        letter-spacing="1">حكر الجامع</text>
</svg>
